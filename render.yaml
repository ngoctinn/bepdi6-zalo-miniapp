services:
  # -------------------------------------------------------------
  # Backend Web Service (Django + uv + gunicorn)
  # -------------------------------------------------------------
  - type: web
    name: bepdi6-backend
    runtime: python
    plan: free
    region: singapore
    buildCommand: "curl -LsSf https://astral.sh/uv/install.sh | sh && export PATH=\"$HOME/.local/bin:$PATH\" && uv sync --frozen && uv run python apps/backend/manage.py migrate && uv run python apps/backend/manage.py collectstatic --noinput"
    startCommand: "export PATH=\"$HOME/.local/bin:$PATH\" && PYTHONPATH=apps/backend uv run gunicorn config.wsgi:application --bind 0.0.0.0:$PORT --workers 2"
    healthCheckPath: /healthz
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.0
      - key: DEBUG
        value: "False"
      - key: SECRET_KEY
        generateValue: true
      - key: ALLOWED_HOSTS
        value: ".onrender.com,localhost,127.0.0.1"
      - key: DATABASE_URL
        sync: false # Connect external Postgres like Supabase / Neon
      - key: REDIS_URL
        sync: false
      - key: CORS_ALLOWED_ORIGINS
        value: "https://h5.zdn.vn,zbrowser://h5.zdn.vn"

  # -------------------------------------------------------------
  # Celery Background Worker Service
  # -------------------------------------------------------------
  - type: worker
    name: bepdi6-celery-worker
    runtime: python
    plan: free
    region: singapore
    buildCommand: "curl -LsSf https://astral.sh/uv/install.sh | sh && export PATH=\"$HOME/.local/bin:$PATH\" && uv sync --frozen"
    startCommand: "export PATH=\"$HOME/.local/bin:$PATH\" && PYTHONPATH=apps/backend uv run celery -A config worker --loglevel=info --concurrency=2"
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.0
      - key: DEBUG
        value: "False"
      - key: SECRET_KEY
        fromService:
          name: bepdi6-backend
          type: web
          envVarKey: SECRET_KEY
      - key: DATABASE_URL
        fromService:
          name: bepdi6-backend
          type: web
          envVarKey: DATABASE_URL
      - key: REDIS_URL
        fromService:
          name: bepdi6-backend
          type: web
          envVarKey: REDIS_URL
