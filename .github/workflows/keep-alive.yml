name: Render Keep-Alive Ping

on:
  schedule:
    # Runs every 10 minutes (UTC)
    - cron: "*/10 * * * *"
  workflow_dispatch: # Cho phép trigger thủ công từ giao diện GitHub Actions

jobs:
  keep-alive:
    name: Ping Healthcheck Endpoint
    runs-on: ubuntu-latest
    steps:
      - name: Send HTTP GET Ping
        env:
          # Cấu hình Secret RENDER_BACKEND_URL trong Settings > Secrets and variables > Actions
          # Hoặc fallback về URL render nếu có
          TARGET_URL: ${{ secrets.RENDER_BACKEND_URL }}
        run: |
          if [ -z "$TARGET_URL" ]; then
            echo "⚠️ [Warning] RENDER_BACKEND_URL secret is not set in GitHub repository."
            echo "Vui lòng thêm secret RENDER_BACKEND_URL (ví dụ: https://bepdi6-backend.onrender.com/healthz) vào GitHub Secrets."
            exit 0
          fi

          echo "Pinging $TARGET_URL..."
          HTTP_STATUS=$(curl -s -o /dev/null -w "%{http_code}" --max-time 30 "$TARGET_URL")
          echo "Response HTTP Status: $HTTP_STATUS"

          if [ "$HTTP_STATUS" -ge 200 ] && [ "$HTTP_STATUS" -lt 400 ]; then
            echo "✅ Backend is active & healthy."
          else
            echo "⚠️ Backend returned HTTP $HTTP_STATUS (or timed out)."
          fi
